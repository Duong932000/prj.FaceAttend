[project]
name = "faceattend"
version = "0.1.0"
description = "Realtime Face Attendance System"
authors = [{name = "Nguyen Dac Duong"}]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.2.2",
    "torchvision==0.17.2",
    "insightface==0.7.3",
    "onnxruntime-gpu==1.19.2",
    "onnx==1.16.0",
    "onnxscript==0.1.0",
    "numpy==1.26.4",
    "opencv-python==4.9.0.80",
    "matplotlib==3.8.3",
    "PyYAML==6.0.1",
    "tqdm==4.66.2",
    "faiss-cpu==1.7.4",
    "customtkinter==5.2.2"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]
include = ["scripts/*.sh"]
