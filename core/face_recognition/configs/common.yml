face_recognition:
  model:
    name: buffalo_l
    det_size: [320, 320]
    ctx_id: 0
    download_url: https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_l.zip

  alignment:
    image_size: 112

  dataset_capture:
    camera_id: 0
    image_width: 1280
    image_height: 720
    capture_per_pose: 15
    stable_frames_required: 10
    capture_interval_sec: 0.4
    min_face_size: 140
    blur_threshold: 70
    brightness_min: 60
    brightness_max: 190
    poses:
      - front
      - left
      - right
      - up
      - down
      - mask
      - glasses

  realtime_inference:
    camera_id: 0
    window_name: "Realtime Face Recognition"
    frame_width: 1280
    frame_height: 720
    det_size: [320, 320]
    similarity_threshold: 0.45
    unknown_label: "UNKNOWN"
    show_fps: true
    draw_landmarks: false

  paths:
    config_path: core/face_recognition/configs/config.yml
    output_root: output/face_recognition
    raw_dataset: output/face_recognition/datasets/raw
    aligned_faces: output/face_recognition/datasets/aligned_faces
    embeddings: output/face_recognition/datasets/embeddings
    indexes: output/face_recognition/datasets/indexes
