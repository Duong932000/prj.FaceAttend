models:
  name: MobileNetV3-Large
  num_classes: 5
  dropout_rate: 0.3
  width_mult: 1.0
  pretrained: true
  freeze_backbone: false

input:
  image_size: 112

training:
  epochs: 20
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  label_smoothing: 0.1

device: cuda

inference:
  confidence_threshold: 0.5
  unsafe_threshold: 0.7

paths:
  model_output_dir: output/face_mask_detection/pth
  model_name: face_mask_model.pth
